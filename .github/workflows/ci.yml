name: CI

# Replaces the Jenkins openstudio-standards and openstudio-standards-develop jobs (Jenkinsfile, Jenkinsfile_develop).
on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.image }}, shard ${{ matrix.shard }})
    # Fork PRs always run on GitHub-hosted runners. Setting the STANDARDS_RUNS_ON repository variable
    # (e.g. to the self-hosted label linux-x64-heavy) moves runs from this repo's own branches there.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name || github.repository) != github.repository && 'ubuntu-24.04' || vars.STANDARDS_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 350
    container:
      image: nrel/openstudio:${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11.0 = Jenkinsfile, the alpha = Jenkinsfile_develop
        image: ['3.11.0', '3.12.0-alpha-29ea277545']
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARDS: 8
      LANG: en_US.UTF-8
      BUNDLE_PATH: /tmp/bundle
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bundle
          key: bundle-${{ matrix.image }}-${{ hashFiles('Gemfile', 'openstudio-standards.gemspec') }}
          restore-keys: bundle-${{ matrix.image }}-

      - name: Install dependencies
        run: |
          locale-gen en_US.UTF-8
          gem install bundler -v '2.4.10'
          bundle _2.4.10_ install
          ruby -v
          openstudio openstudio_version

      - name: Select this shard's tests
        # Round-robin over the sorted test list, so each shard gets every SHARDS-th file
        run: |
          grep -E '\.rb[[:space:]]*$' test/ci_tests.txt | grep -vE '^[[:space:]]*#' | sort | awk -v n="$SHARDS" -v i="${{ matrix.shard }}" 'NR % n == i' > shard_tests.txt
          mv shard_tests.txt test/ci_tests.txt
          echo "Running $(wc -l < test/ci_tests.txt) test files:"
          cat test/ci_tests.txt

      - name: Run tests
        run: CPUS="$(nproc)" bundle _2.4.10_ exec rake test:parallel_run_all_tests_locally

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.image }}-shard-${{ matrix.shard }}
          path: |
            test/reports
            test/output
          if-no-files-found: ignore
          retention-days: 14
